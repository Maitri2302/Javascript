<html lang="en">
<head>
    <meta charset="UTF-8">

<body style="background-color: #212121;  color: #fff;">
    <h2>Images</h2>
    <div>
        <ul id="images">
            <li><img width="200px" id="photoshop" src="https://upload.wikimedia.org/wikipedia/commons/a/af/Pexels-photo-1236701.jpg" alt=""></li>
            <li><img width="200px" id="japan" src="https://sg.jtbtrip.com/cdn/shop/files/japan-nationwide-rail-pass-general1.jpg?v=1730879305&width=3200" alt=""></li>
            <li><img width="200px" id="river" src="https://images.pexels.com/photos/1480807/pexels-photo-1480807.jpeg?cs=srgb&dl=pexels-baskincreativeco-1480807.jpg&fm=jpg" alt=""></li>
            <li><img width="200px" id="owl" src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQYesAWxqYmGLSh6FvHBz1bDg13LNLi6aeR3w&s" alt="" ></li>
            <li><img width="200px" id="prayer" src="https://cdn.pixabay.com/photo/2016/11/29/05/45/astronomy-1867616_1280.jpg" alt=""></li>
            <li><a style="color: #fff;" href="https://google.com" id="google">Google</a></li>
        </ul>
    </div>

        document.getElementById('google').addEventListener('click',function(e){
            e.preventDefault();
            e.stopPropagation();
            console.log('google clicked')
        })

        document.querySelector('#images').addEventListener('click',function(e){
            console.log(e.target);
            console.log(e.target.parentNode);
            console.log(e.target.tagName)

            if(e.target.tagName === 'IMG'){
                let removeIt=e.target.parentNode;
                removeIt.remove();
            }
            // removeIt.parentNode.removeChild(removeIt)
        })

    </script>
