<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            padding:0;
            margin:0;
            box-sizing: border-box;
        }
        html,
        body{
            width: 100%;
            height: 100%;
        }
        body{
            position: relative;
            overflow: hidden;
        }
        #main{
            width: 100%;
            height: 100%;
            background-color: #222;
        }
        #nav {
            width: 100%;
            background-color: #444;
            padding: 10px 0;
        }
        #nav ul{
            display:flex;
            align-items:center;
            justify-content: center;
            gap:150px;
            list-style: none;
        }
        a{
            color:white;
            text-decoration: none;
            font-size:18px;
        }
        button{
            padding: 10px 20px;
            background-color: red;
            color:white;
            border-radius: 5px;
            border: none;
            font-weight: bold;
            font-size: 20px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div id="main">
        <div id="nav">
            <ul>
                <li><a href="#">Home</a></li>
                <li><a href="#">About</a></li>
                <li><button>Contact</button></li>
            </ul>
        </div>
    </div>
    <div>
        <ul>
            <li>Apple</li>
            <li>Mango</li>
            <li>Oranges</li>
            <li>Banana</li>
            <li>Strawberry</li>
        </ul>
    </div>
    <script src="script.js"></script>
</body>
</html>
