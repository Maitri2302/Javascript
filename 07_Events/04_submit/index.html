<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #222;
            color: #fff;
            padding: 20px;
        }
        form {
            display: flex;
            flex-direction: column;
            width: 300px;
            margin: 0 auto;
        }
        input, button {
            margin-bottom: 10px;
            padding: 8px;
            font-size: 16px;
        }
        .card{
            max-width:200px;
            color:#fff;
            margin-top: 40px;
            border-radius:10px;
            padding: 20px;
            display:inline-block;
            border: 2px solid #fff;
        }
        .profile{
            width: 50px;
            height: 50px;
            border-radius: 50%;
            margin-bottom: 20px;
            overflow:hidden;
        }
        .profile img{
            width: 100%;
            height: 100%;
            object-fit: cover;
            padding: 5px;
            margin-left: 5px;
        }
        .card h3{
            margin-top: 2px;
        }
        .card h5{
            margin-top: 2px;
        }
        .card p{
            font-size:12px;
            margin-top:10px;
        }
</style>
</head>
<body>
    <div id="main">
        <form>
            <input type="text" name="image" placeholder="Enter your image">
            <input type="text" name="name" placeholder="Enter your name">
            <input type="text" name="age" placeholder="Enter your age">
            <input type="text" name="info" placeholder="Enter your details">
            <button type="submit">Submit</button>
        </form>
    </div>
    <script src="script.js"></script>
</body>
</html>
