<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Card</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="main">
        <div class="left-buttons">
            <button>+</button>
            <button>↑</button>
            <button>↓</button>
        </div>
        <div class="card-wrapper">
            <div class="card card-3"></div>
            <div class="card card-2"></div>
            <div class="card card-main">
                <div class="top">
                    <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=100" alt="Rebecca">
                </div>
                <div class="details">
                    <h2>Rebecca</h2>
                    <div class="info">
                        <span>Home town</span>
                        <span>Indore</span>
                    </div>
                    <div class="info">
                        <span>Purpose</span>
                        <span>Quick Call for Appointment</span>
                    </div>
                </div>
                <div class="actions">
                    <button class="call">
                        ☎ Call
                    </button>
                    <button class="message">
                        Message
                    </button>
                </div>
            </div>
        </div>
        <div class="colors">
            <span class="color black"></span>
            <span class="color purple"></span>
            <span class="color brown"></span>
            <span class="color green"></span>
        </div>
    </main>
</body>
</html>
