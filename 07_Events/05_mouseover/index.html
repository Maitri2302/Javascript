<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html,
        body{
            width:100%;
            height:100%;
        }
        body{
            position: relative;
            overflow:hidden;
        }
        #main{
            position:absolute;
            transition: all cubic-bezier(0.19, 1, 0.22, 1) 1s;
            height: 200px;
            width: 200px;
            background-color: rgb(243, 70, 70);
        }
    </style>
</head>
<body>
    <div id="main">

    </div>
    <script src="script.js"></script>
</body>
</html>
