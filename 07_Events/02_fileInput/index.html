<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }
        html,
        body{
            width: 100%;
            height: 100%;
        }
        #main{
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 100%;
            background-color: #222;
        }
        h1{
            color:#555;
            font-size:12rem;
            user-select: none;
            font-weight: 200;
            letter-spacing: -1rem;
        }
        #fileInp {
        display: none;
    }
        #btn{
            padding: 12px 22px;
            background-color: rgb(41,143,114);
            color:white;
            border-radius: 5px;
        }
        #btn:hover{
            background-color: rgb(24,82,66);
        }
    </style>
</head>
<body>
    <div id="main">
        <input id="fileInp" type="file">
        <div id="btn">
            Upload File
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
