<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Color Scheme Switcher</title>
    <link rel="stylesheet" href="style.css">
    
</head>
<body>
    <nav>
        <a href="#">Home</a>
        <a href="#">Youtube channel</a>
    </nav>

    <main>
        <h1>Color Scheme Switcher</h1>
        <div class="colors">
            <div id="grey" class="color-box" style="background-color: grey;"></div>
            <div id="white" class="color-box" style="background-color: white;"></div>
            <div id="blue" class="color-box" style="background-color: blue;"></div>
            <div id="yellow" class="color-box" style="background-color: yellow;"></div>
        </div>

        <p>Try clicking on one of the colors above <br>to change the background color of this page!</p>
    </main>
    <script src="script.js"></script>
</body>
</html>
